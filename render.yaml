# Render Blueprint for AstroPilot: the web app and its Postgres database, deployed from GitHub.
# Render → New → Blueprint → choose hkaldis/astropilot. Every push to `main` then deploys automatically.
# Values marked `sync: false` are secrets you paste once in the Render dashboard (see docs/hosting.md).
services:
  - type: web
    name: astropilot
    runtime: node
    plan: 0.5c-512mb # 0.5 CPU / 512 MB, always on ($7/month); the free plan sleeps after 15 minutes idle
    region: frankfurt
    branch: main
    autoDeployTrigger: commit # deploy every push to main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://astropilot.space
      - key: DATABASE_URL
        fromDatabase:
          name: astropilot-db
          property: connectionString
      - key: SESSION_SECRET # copy it from Replit Secrets so everyone stays signed in
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY # optional: donations
        sync: false

databases:
  - name: astropilot-db
    plan: 0.1c-256mb # 0.1 CPU / 256 MB ($6/month)
    diskSizeGB: 5 # $0.30 per GB a month; plenty for years of resized photos
    storageAutoscalingEnabled: true # grows by 50% whenever it's 90% full, so it never runs out
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: astropilot
    user: astropilot

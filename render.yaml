# Render Blueprint for AstroPilot, deployed from GitHub: every push to `main` deploys automatically.
# Render → New → Blueprint → choose hkaldis/astropilot. Values marked `sync: false` are pasted once in
# the Render dashboard. The database is Neon's free Postgres (see docs/hosting.md).
#
# Free plan: the app sleeps after 15 minutes without visitors and takes about a minute to wake (a free
# uptime monitor pinging /api/health every 10 minutes keeps it awake). For always-on, change `plan` to
# `starter` (paid) — nothing else changes.
services:
  - type: web
    name: astropilot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://astropilot.space
      - key: DATABASE_URL # Neon → your project → Connect → the direct (not "-pooler") connection string
        sync: false
      - key: SESSION_SECRET # copy it from Replit Secrets so everyone stays signed in
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY # optional: donations
        sync: false

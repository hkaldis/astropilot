# Render Blueprint for AstroPilot: the web app and its Postgres database, deployed from GitHub.
# Render → New → Blueprint → choose hkaldis/astropilot. Every push to `main` then deploys automatically.
# Values marked `sync: false` are secrets you paste once in the Render dashboard (see docs/hosting.md).
services:
  - type: web
    name: astropilot
    runtime: node
    plan: starter # always on; the free plan sleeps after 15 minutes idle
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://astropilot.space
      - key: DATABASE_URL
        fromDatabase:
          name: astropilot-db
          property: connectionString
      - key: SESSION_SECRET # copy it from Replit Secrets so everyone stays signed in
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY # optional: donations
        sync: false

databases:
  - name: astropilot-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: astropilot
    user: astropilot

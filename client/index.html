<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AstroPilot · Your night sky, planned</title>
    <meta name="description" content="AstroPilot tells you if tonight is worth it, what to observe with your telescope, when and where to look, and keeps your observing log." />
    <meta name="theme-color" content="#05070c" />
    <meta property="og:title" content="AstroPilot · Your night sky, planned" />
    <meta property="og:description" content="Accurate observing forecasts, personalised targets for your telescope, an interactive sky chart and an observing journal." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("ap.theme") || "dark";
          var root = document.documentElement;
          root.classList.remove("dark", "light", "night-vision");
          if (t === "light") root.classList.add("light");
          else root.classList.add("dark");
          if (t === "night") root.classList.add("night-vision");
        } catch (e) {}
      })();
    </script>
    <script>
      if (location.hostname === "astropilot.space" || location.hostname === "www.astropilot.space") {
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-3M0S5XP8HN";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-3M0S5XP8HN");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
